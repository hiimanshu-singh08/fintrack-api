spring.application.name=fintrack-api

spring.datasource.url=jdbc:h2:mem:fintrackdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Dev-only default. In production, override via the JWT_SECRET env var - never commit a real secret.
jwt.secret=${JWT_SECRET:dev-only-fintrack-secret-key-change-me-please-32bytes-min}
jwt.expiration-ms=3600000

logging.level.com.fintrack.api=INFO
